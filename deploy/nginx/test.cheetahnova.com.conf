server {
    listen 80;
    listen [::]:80;
    server_name test.cheetahnova.com;

    return 301 https://toplinksho.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name test.cheetahnova.com;

    ssl_certificate /etc/letsencrypt/live/test.cheetahnova.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.cheetahnova.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://toplinksho.com$request_uri;
}
